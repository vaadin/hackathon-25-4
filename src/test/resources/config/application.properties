# Tests keep the workbench drafts in memory, one database per test context,
# never in the developer's home directory. Spring Boot reads this file after
# the application's own, so it overrides only what it names.
spring.datasource.url=jdbc:h2:mem:drafts-${random.uuid};DB_CLOSE_DELAY=-1

# No test calls a model, even on a machine where the key is set and the ai
# profile is active, D-136. LiveAssistantTest switches this back on.
securitystatus.assistant.live=false

# The banner is one more screenful per test context, times every context the suite starts.
spring.main.banner-mode=off
