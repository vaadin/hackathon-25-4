# Tests keep the workbench drafts in memory, one database per test context,
# never in the developer's home directory. Spring Boot reads this file after
# the application's own, so it overrides only what it names.
spring.datasource.url=jdbc:h2:mem:drafts-${random.uuid};DB_CLOSE_DELAY=-1

# No test calls a model, even on a machine where the key is set and the ai
# profile is active, D-136. LiveAssistantTest switches this back on.
securitystatus.assistant.live=false

# The banner is one more screenful per test context, times every context the suite starts.
spring.main.banner-mode=off

# Tests say what they are, because a previous build leaves its answer behind.
# The frontend build writes flow-build-info.json with productionMode true into
# target/classes after the tests of that same run, and the next run reads it:
# ProfileGuard then refuses to start, and the application hides the assistant,
# which is right in production and wrong here, D-236. Both of these made every
# run after the first one red until somebody ran clean.
# A test that needs another profile says so with @ActiveProfiles, as the cas ones do.
spring.profiles.active=demo
vaadin.productionMode=false
