id = "CVE-2025-15056"
reason = "quill: fixed: Fixed on this line. Platform 25.3.5 pins @vaadin/rich-text-editor 25.3.5, whose vendored Quill escapes the video and formula values before building the semantic HTML, and the reproduction that fires on 25.3.4 does not fire here. The patched copy keeps Quill's own version string 2.0.3, because the fix is ours and there is no Quill release to move to, so a scanner reading the bundled file reports the advisory on this version anyway. That report is stale, not a second finding. CVE-2026-120350 names this same flaw: it is the advisory Vaadin itself published for it, and CVE-2025-15056 is the id under which it was first reported, so a scanner may lead with either. One record, one fix, and this verdict answers both ids."

