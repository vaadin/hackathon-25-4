id = "CVE-2026-116796"
reason = "highcharts: fixed: Fixed in Vaadin 25.3.1. Vaadin Charts pins Highcharts 12.2.0 exactly, and of the advisories Highsoft disclosed on 29 September 2026, all five reach Highcharts 12.2.0: writes to Object.prototype through dotted series.keys paths, and cross site scripting through credits.href, breadcrumbs.style, HTML text parsing while printing, and xlink:href in exported charts. Vaadin 25.3.1 and later apply Highsoft's recommended workarounds to the bundled Highcharts when it loads and keep the same Highcharts version, so your scanner still reports highcharts 12.2.0 on a fixed release. Vaadin published this as CVE-2026-107588."

