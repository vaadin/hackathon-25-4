# Signing in through vaadin.com's staging single sign on from this machine:
# map localdev.vaadin.com to 127.0.0.1 in /etc/hosts, then run with the
# profiles cas and cas-local. Staging CAS admits localdev.vaadin.com only.
securitystatus.cas.server=https://cas-stg.vaadin.com
securitystatus.cas.service=http://localdev.vaadin.com:${server.port:8080}/login/cas
