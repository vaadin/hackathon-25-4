explorer.detail.nothing=Nothing on this release is waiting for you: every finding a scanner reports carries a verdict and none of them is a risk.
explorer.detail.frontend=Of these, {0,choice,1#1 finding is|1<{0} findings are} in the frontend bundle the framework publishes, so {0,choice,1#it is|1<they are} carried whatever products are in use.
explorer.detail.untraced=And {0,choice,1#1 finding|1<{0} findings} we could not trace to a product, so {0,choice,1#it is|1<they are} counted whatever is turned on above.
