explorer.state.VULNERABLE.means=At least one finding on this release carries a verdict of real risk. The advisory applies to the version your application resolves and no Vaadin release moves it, so there is something to do and each finding says what. It does not mean we have demonstrated an attack through Vaadin's own API: where we have run one, the finding says so.
explorer.state.UNJUDGED.means=Something here has no verdict yet, so this release is red. Nobody has looked, and a finding nobody has looked at is not evidence that you are safe.
explorer.state.NOT_AFFECTED.means=Every finding on this release is answered and none of them is a risk: the code is not in what we ship, or it needs something switched on that is off by default, or it cannot be exploited the way the advisory describes, or the report is wrong about this version, or the version you resolve already carries the fix. It is not a promise that the release has no bugs, it is that nothing known is left unanswered.
explorer.badge.spring.title=What the Spring Boot your application inherits brings, measured against {0}. No Vaadin release moves these and your own pom decides which Spring Boot you are on, so this badge is about that release rather than about Vaadin. Upgrading Spring Boot is what moves them, and the Spring Boot screen says what each release brings.
