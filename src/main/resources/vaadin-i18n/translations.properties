# The verdict workbench
workbench.title=The verdict queue
workbench.menu=Verdict workbench
workbench.lead.open={0,choice,1#1 finding carries|1<{0} findings carry} no verdict on {1}, over {2,choice,1#1 package|1<{2} packages}. The first row below is worth {3} per cent of that on its own.
workbench.lead.none=Nothing on {0} is waiting for a verdict. {1,choice,0#|1#The 1 package below is answered.|1<The {1} packages below are all answered.}
workbench.scope.all=the heads of the series we follow
workbench.scope.series=the head of {0}
workbench.hint=A verdict is keyed by a package with no version and answers for every series at once, so the queue is one row per package and is ranked by what a single verdict there would take out of it, not by severity. Open a row to see what it holds and to write one.
workbench.series.label=Narrow the queue to one series
workbench.series.all=every series
workbench.series.one={0} {1}
workbench.series.title={0,choice,0#{0} advisories|1#1 advisory|1<{0} advisories} to judge on {1}
workbench.row.todo=to judge
workbench.row.done=answered
workbench.row.says={0,choice,1#1 advisory|1<{0} advisories} on {1,choice,1#1 series|1<{1} series}, {2}
workbench.row.spring=. Spring Boot owns the version, so a bump is not one of the answers here
workbench.acknowledged=Already in the check list of {0}. An entry silences a finding only when it lists every id on the package, so the rest keep that build red.
workbench.acknowledged.branch={0} ({1} of {2})
workbench.unread=We could not read the list of {0}, so nothing is claimed about {1,choice,1#it|1<them}.
workbench.evidence.resolves=Resolves to
workbench.evidence.on=on {0}
workbench.evidence.routes=Arrives by
workbench.evidence.declared=declared by {0}
workbench.evidence.cpes=CPE matched
workbench.evidence.cpes.hint=vendor:product:target_sw. A target_sw that is not this ecosystem is a collision and settles the verdict on its own.
workbench.evidence.scanners=Reported by {0}.
workbench.evidence.batch=Of {0,choice,1#1 advisory|1<{0} advisories} here, {1}.
workbench.evidence.fixed=upstream has fixed {0}
workbench.evidence.absent=osv.dev does not list {0} against the version we resolve, each with its reason beside it. That is what a dependency-check CPE match looks like and where a false_positive usually starts, though it is not proof on its own
workbench.evidence.and=, and\u0020
workbench.evidence.frontend=Frontend. Compare the upstream fix date with the publish date of that release's vaadin-dev-bundle before judging: a transitive package leaves on the next release that rebuilds the lockfile and earns fix_expected_version, not a verdict, while one the framework pins exactly never moves on its own.
workbench.compose=Write a verdict
workbench.compose.says=composes the YAML and the pull request, writes nothing by itself
workbench.home=Write a verdict for a package typed by hand
workbench.reuse=This package already carries a verdict
workbench.reuse.fill=fill from {0}
workbench.filled=Filled from {0}, which answers {1,choice,1#1 advisory|1<{1} advisories} here. Composing now writes a new file that supersedes it; the old one stays where it is.
workbench.filled.narrow=Its range, {0}, does not reach {1}, which is why those advisories are still open here. Widen it or the new verdict will answer no more than the old one.
workbench.picks=Which advisories this verdict answers
workbench.said.fixed=fixed in {0}
workbench.said.fixed.on={0} on {1}
workbench.said.absent.all=not listed: {0}
workbench.said.absent.some=not on {0}: {1}
workbench.said.git=the advisory gives a commit range and no package range
workbench.said.already=already {0}
workbench.said.already.in=already {0} in {1}
workbench.said.elsewhere=answered on other series by {0}, not here
workbench.said.and=\u0020and\u0020
workbench.why.other_package=the advisory is about another package
workbench.why.other_package.about=the advisory is about {0}
workbench.why.other_versions=the advisory covers other versions of this package
workbench.why.commit_range=the advisory gives commits and no package range, so a scanner matches by name
workbench.why.no_record=osv.dev holds no record under this id, so it reaches us through the NVD alone
workbench.why.unlisted=osv.dev does not list the version we resolve
workbench.summary.title=The queue in figures
workbench.summary.total={0,choice,1#One finding|1<{0} findings} over {1,choice,1#one package|1<{1} packages}, {2} of them with no verdict.
workbench.summary.severity=Severity
workbench.summary.line=Series
workbench.summary.findings=Findings
workbench.summary.unjudged=With no verdict
workbench.composing=A verdict on {0}
workbench.composing.none=A verdict
workbench.elsewhere=You are looking at {0}, and {1,choice,1#1 advisory of this package reaches|1<{1} advisories of this package reach} other series only. They are all listed below, because a verdict is keyed by the package and answers for every series at once. Leave one unticked only when the answer there is different.
workbench.reach=This closes {0,choice,1#1 advisory|1<{0} advisories} on {1,choice,1#1 series|1<{1} series}, {2}, which is {3,choice,1#1 finding|1<{3} findings} off the page; {4} of them carry no verdict now.
workbench.reach.silences=It also silences them for any build reading the published check list.
workbench.reach.risk=It silences nothing: a risk is us saying the reader is exposed, so it stays on the page and stays out of the check list.
workbench.platform=This does not turn a build green on its own. {0} would still go red, because the entry in each of those has to list every id on this package and {1,choice,1#it does|1<they do} not yet. That is a second pull request, in vaadin/platform, one per branch.
workbench.path=It belongs at {0}. The writer refuses to overwrite an existing file, which is how the rule against editing a verdict in place is enforced.
workbench.check=Then run python scripts/ci/check_assessments.py, which parses it, checks it is named after itself and checks the package still reaches a stored SBOM. It reads no word of the prose, so the commentary, the impact and the evidence are checked by the reviewer and by nobody else.
workbench.footer=The heads of the followed series only, because nobody writes a verdict for a version that has been superseded. This page composes and hands over: it runs nothing, resolves nothing and opens nothing on its own.
