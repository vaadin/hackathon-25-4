explorer.half.ours=From Vaadin
explorer.half.ours.title=What a Vaadin release brings and what a Vaadin release can move. This is the half the Vaadin badge answers for.
explorer.half.theirs=With Spring Boot
explorer.half.theirs.title=Your Spring Boot brings these, not a Vaadin release. They are in your application all the same, and the way to move them is your own Spring Boot version.
explorer.half.theirs.lead={0,choice,1#1 finding on this series comes|1<{0} findings on this series come} with Spring Boot rather than with Vaadin, measured against {1}.
explorer.half.theirs.declared=This release declares Spring Boot {0}, so on what Vaadin built it against there are at least these and probably more. Your own pom decides which you are on.
explorer.half.theirs.moves=Upgrading Spring Boot is what moves them and no Vaadin release can.
explorer.half.theirs.link=See what Spring Boot brings
explorer.half.theirs.unknown=the release our reference application declares
explorer.half.group={0} {1}
explorer.half.group.RISK=a real risk
explorer.half.group.UNJUDGED=not assessed yet
explorer.half.group.ANSWERED=answered, nothing to do
explorer.half.group.RISK.title=The advisory applies to the version your application resolves and no Vaadin release moves it, so there is something for you to do and each one says what. It is not a demonstration that the code can be reached through Vaadin: that is a separate claim and a finding that carries it says it was reproduced.
explorer.half.group.UNJUDGED.title=Reported by a scanner and not looked at by us. It may turn out not to apply at all, and until somebody looks it keeps this release red.
explorer.half.group.ANSWERED.title=One of five answers: the code is not in what we ship, it is reachable only with something switched on that is off by default, it is there and cannot be exploited the way the advisory describes, the report is wrong about this package or version, or the version you resolve already carries the fix. Shut by default, because a reader looking for what to do should not read past fifty of these to find three.
