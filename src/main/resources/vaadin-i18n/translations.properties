workbench.help.verdictId=Names the file. Letters, digits, dots and hyphens.
workbench.help.purl=A purl without a version, such as pkg:maven/group/artifact.
workbench.help.advisories=CVE or GHSA ids, separated by spaces or commas.
workbench.help.applicability=
workbench.help.depth=The page prints this, and a reader deciding whether to act on the verdict is entitled to know whether anybody ran anything.
workbench.help.affects=A range, never a single version. A verdict keyed to an exact version stops applying the moment the dependency is bumped.
workbench.help.impact=Exit first. Open with the negation of a condition this verdict already states, then the harm. Where everybody is affected, say so plainly. Required for risk and no risk.
workbench.help.workaround=What a reader can do until a release carries the fix.
workbench.help.commentary=Refused empty by the writer, because a verdict with no commentary explains nothing and cannot be reviewed.
workbench.help.fixExpected=Prose. Nothing checks it.
workbench.help.fixExpectedVersion=A mapping of series to version, like 25.3: 25.3.4. This is the one field the nightly checks against the measurement, and the one the command line cannot write.
workbench.help.fixPrs=GitHub pull request urls, separated by spaces. Also unwritable from the command line today.
workbench.help.evidence=
workbench.help.supersedes=The id of the verdict this replaces. A verdict is never edited in place; it is superseded, and the old file stays as the trail.
workbench.help.assessedBy=
workbench.applicability.risk=affects you: It is real and it reaches a Vaadin application. Does not silence anything.
workbench.applicability.not_affected=not used by Vaadin: The vulnerable code is not in what we ship.
workbench.applicability.configuration=used only in specific configurations: Reachable only with something switched on that is off by default.
workbench.applicability.no_risk=used, no risk: We call the code and it cannot be exploited the way the advisory describes.
workbench.applicability.false_positive=scanner false positive: The report itself is wrong about this package or this version.
workbench.applicability.fixed=already fixed in a release: The version we resolve carries the fix.
workbench.depth.cursory=read, not run: The advisory, the jar and the tree were read.
workbench.depth.reproduced=reproduced against an application: A probe was run, with the control that proves the probe works. poc/<id>/ holds it.
workbench.depth.committee=reviewed by the security team: It went past more than one person.
workbench.depth.automatic=carried over, not re-assessed: Imported from somewhere else and not re-read.
workbench.invalid.required=Required to export
workbench.invalid.id=Letters, digits, dots and hyphens only, starting with a letter or a digit
workbench.invalid.purl=A purl without a version, starting with pkg:
workbench.invalid.advisories=CVE or GHSA ids only, separated by spaces or commas
workbench.invalid.affects=Bounds such as >=24.9,<25.3, or *
workbench.invalid.promise=Line and release pairs, such as 25.3: 25.3.4
workbench.invalid.promise.line=Each release has to belong to the line it is written under
workbench.invalid.pulls=GitHub pull request addresses only
workbench.invalid.impact=A risk or no risk verdict answers nothing without an impact sentence

