explorer.legend.reviewed=Reviewed by the Vaadin security team
explorer.legend.reviewed.means=Somebody read the advisory, the dependency tree and the code that carries it, and wrote down what they checked. Most verdicts here are this.
explorer.legend.reproduced=Reproduced against a Vaadin application
explorer.legend.reproduced.means=Somebody built an application, ran it and measured what happens, with a control run proving the probe would have seen the problem if it were there. It is the stronger claim and it is rarer, so the page says which one you are reading rather than letting them look alike.
explorer.legend.measuring=What this page is measuring
explorer.legend.measuring.shape=Every series here is measured against an application shaped like the starter of its own major, which is what a customer gets from start.vaadin.com and what makes one release comparable with another.
explorer.legend.measuring.missing=A series missing from the table is one we do not follow, which is usually one out of maintenance. That is a gap in what we measure and not a clean bill for it.
