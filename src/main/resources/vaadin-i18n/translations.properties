lookup.help.version.title=How to enter your version
lookup.help.version.what=What goes in the field
lookup.help.version.what.text=Your Vaadin version as your build names it, for example 24.9.20. V24.9.20 and Vaadin 24.9.20 are read as the same version. A CVE or GHSA id typed here moves to the By CVE tab.
lookup.help.version.unmeasured=A version that is not in the list
lookup.help.version.unmeasured.text=The list holds the releases we have measured. Any other version can still be checked, and the answer then says that we have not measured it and offers the nearest release that we have.
lookup.help.ids.title=How to use this lookup
lookup.help.ids.first=What goes in the first field
lookup.help.ids.first.text=The ids exactly as your scanner printed them, CVE or GHSA, one or a whole batch separated by spaces, commas or new lines. Each id pasted gets an answer of its own, so there is no need to look them up one by one.
lookup.help.ids.why=Why we ask for your version
lookup.help.ids.why.text=An advisory is not fixed or unfixed on its own, it is fixed in a release. "Fixed in 24.9.28" answers nothing until we know you are on 24.9.20. Name your version and each answer tells you whether that release is affected and which release to move to, which is the answer a ticket needs. Leave it empty and you get what we measured on every supported line, with finding your own left to you.
lookup.help.ids.ruled=Findings we ruled out are answered here too
lookup.help.ids.ruled.text=Where an advisory is real but cannot reach a Vaadin application, that is an answer with the reason behind it. It is the one that closes a ticket without an upgrade.
lookup.help.report.title=What is assessed, and how to produce a report
lookup.help.report.assessed=What is assessed, and what is not
lookup.help.report.assessed.text=The dependencies Vaadin brings: everything inside the bill of materials of the Vaadin artifacts in your build, which is what our scanners measure, release by release.
lookup.help.report.rest.text=Everything else your file lists, your own libraries and the ones the rest of your stack brings, is not assessed here. It comes back as yours with no verdict, because we do not measure it and will not tell you it is secure.
lookup.help.report.scope.all=Every coordinate in the file you uploaded is one we measure, so the table answers for all of it.
lookup.help.report.scope.inventory.one=The file you uploaded lists {0} dependencies, and we have measurements on {1} of them: those are the ones answered. The remaining one is either yours or a Vaadin dependency with no advisory ever reported against it, so nothing here assesses it.
lookup.help.report.scope.inventory.many=The file you uploaded lists {0} dependencies, and we have measurements on {1} of them: those are the ones answered. The remaining {2} are either yours or a Vaadin dependency with no advisory ever reported against them, so nothing here assesses them.
lookup.help.report.scope.findings.one=The file you uploaded flags findings on {0} coordinates, and {1} of those are coordinates we measure inside Vaadin releases. The remaining one is not, so its findings come back as yours with no verdict of ours.
lookup.help.report.scope.findings.many=The file you uploaded flags findings on {0} coordinates, and {1} of those are coordinates we measure inside Vaadin releases. The remaining {2} are not, so their findings come back as yours with no verdict of ours.
lookup.help.report.scope.example.one=That one is {0}.
lookup.help.report.scope.example.many=Among them: {0}.
lookup.help.report.kept=Your file is not kept
lookup.help.report.kept.text=Your report is read on our server while it uploads, and the file itself is not stored: no copy of it is written anywhere. What it says is held in this browser session only, to draw the answer, and is gone when the session ends or you upload another file.
lookup.help.report.CYCLONEDX.why=The most useful of the four: it lists every dependency you ship rather than only the ones something has already flagged, so the measurements supply the advisories and the answer covers your whole tree. It names your Vaadin release too.
lookup.help.report.CYCLONEDX.run=mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
lookup.help.report.CYCLONEDX.leaves=Leaves target/bom.json. For the frontend half, npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file target/bom-npm.json writes a second file: upload whichever half you are asking about.
lookup.help.report.DEPENDENCY_CHECK.why=The scanner most builds go red on, and the one that matches by CPE, so it reports things the others cannot see and a few they would call false. It names your release too.
lookup.help.report.DEPENDENCY_CHECK.run=mvn org.owasp:dependency-check-maven:check -Dformat=JSON
lookup.help.report.DEPENDENCY_CHECK.leaves=Leaves target/dependency-check-report.json. JSON, not the HTML it writes by default.
lookup.help.report.OSV_SCANNER.why=A vulnerability report: only the packages something was found in, so it is smaller and it does not name your Vaadin release. You are asked for it once the file is in.
lookup.help.report.OSV_SCANNER.run=osv-scanner scan source -r --format json --output-file osv.json .
lookup.help.report.OSV_SCANNER.leaves=Leaves osv.json in the directory you ran it from.
lookup.help.report.BOMBER.why=Reads the bill of materials above rather than your project. Like osv-scanner it names no release, so you are asked for yours.
lookup.help.report.BOMBER.run=bomber scan target/bom.json --output json > bomber.json
lookup.help.report.BOMBER.leaves=Leaves bomber.json wherever you redirected it.
lookup.help.report.json=Each one as JSON: the HTML and XML these tools can also write are not read. The format is recognised by what is inside the file, whatever it is called.

