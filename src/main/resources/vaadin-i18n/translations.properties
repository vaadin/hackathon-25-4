spring.title=What Spring Boot brings
spring.lead=A Vaadin application is a Spring Boot application, and Spring Boot decides the version of Tomcat, Jackson, the Spring libraries and about forty other things. Those are not Vaadin's to move: no release of ours changes them, and upgrading Spring Boot does. This page is keyed by your Spring Boot release rather than by your Vaadin one, because that is what the answer depends on.
