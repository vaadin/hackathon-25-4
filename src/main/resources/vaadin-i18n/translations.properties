spring.advice.none=We know of nothing newer to take within this major, so until the next release a version property in the application pom moves any one of these.
spring.advice.none.commercial=We know of nothing newer to take within this major that anybody publishes, so until the next release a version property in the application pom moves any one of these.
spring.advice.minor=Spring Boot {0} is a later minor of the same major, which moves more than a patch does and which nothing here has measured. A newer major is not offered at all, because taking one drags a Vaadin upgrade with it.
spring.advice.property=The property is interpolated by spring-boot-dependencies, so it works when the pom inherits spring-boot-starter-parent. A pom that only imports vaadin-bom has to manage the artifacts in its own dependencyManagement instead. Both were measured on 25.3.2.
