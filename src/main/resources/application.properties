server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.vaadin.securitystatus

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update

# The workbench drafts, the only thing this application writes. A file, so a
# draft survives a restart; nothing else reads the database.
securitystatus.drafts.dir=${user.home}/.security-status
spring.datasource.url=jdbc:h2:file:${securitystatus.drafts.dir}/drafts
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false

# Log every call that a strict, nonce based Content Security Policy would refuse.
# The enforced policy itself is sent by SecurityConfig: strict mode only acts in production.
vaadin.csp=warn

# Where the measurements are published, and how often the index is asked whether it moved.
# Everything the application shows is read from here, through the cache in the data package.
securitystatus.pages.base-url=https://vaadin.github.io/cve-status/
securitystatus.pages.revalidate-every=PT15M

# Who signs in, D-258. Without a profile named, the demonstration accounts:
# development mode only, a production start refuses to run without cas or demo.
spring.profiles.default=demo
# demo: team / team and guest / guest, unless the deployment names others, for example
# SECURITYSTATUS_DEMO_TEAM_NAME, SECURITYSTATUS_DEMO_TEAM_PASSWORD,
# SECURITYSTATUS_DEMO_GUEST_NAME and SECURITYSTATUS_DEMO_GUEST_PASSWORD in its environment.
# cas: vaadin.com's single sign on. The service is this application's own callback,
# for example https://vaadin.com/security-status/login/cas.
securitystatus.cas.server=https://sso.vaadin.com
# Signed in with a verified email on this domain is the team.
securitystatus.signin.team-domain=vaadin.com
server.forward-headers-strategy=framework
# The longest answer the model writes in one turn, D-260. Read only when the ai profile brings the model in.
spring.ai.openai.chat.options.max-completion-tokens=2000
